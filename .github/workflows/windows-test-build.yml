name: Windows test build

# Builds the Windows exe of the checked-out branch and keeps it as a
# workflow artifact (7 days). Publishes nothing, creates no tag or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --release --locked -p aurora-viewer --features xr-static-loader
      - name: Package
        shell: pwsh
        run: |
          $dir = "Aurora-Viewer-pose-test-windows-x64"
          ./scripts/package.ps1 -Exe target/release/aurora-viewer.exe -Out $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aurora-Viewer-pose-test-windows-x64
          path: Aurora-Viewer-pose-test-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

# Test build of this fork for Windows, on every push to the Pingmator link
# branch (or by hand from the Actions tab).
# It is a development build (Git distance after the newest tag): it never
# checks for updates, so it does not replace itself with an official release.
# The zip is kept 14 days under the run's Artifacts.
name: Fork Windows test build

on:
  push:
    branches: [feat/pingmator-link, feat/livemesh-pose]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # the version is read from the tags; a fork may not have them all
      - name: Upstream tags
        shell: pwsh
        run: git fetch --tags --force https://github.com/Aurora-Viewer/Aurora-Viewer.git
      - name: Rust stable
        run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p aurora-viewer --features xr-static-loader
      - name: Package
        shell: pwsh
        run: |
          $dir = "Aurora-Viewer-fork-windows-x64"
          ./scripts/package.ps1 -Exe target/release/aurora-viewer.exe -Out $dir
          & target/release/aurora-viewer.exe --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aurora-Viewer-fork-windows-x64
          path: Aurora-Viewer-fork-windows-x64
          if-no-files-found: error
          retention-days: 14
